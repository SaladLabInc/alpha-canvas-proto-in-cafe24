<!doctype html>
<html lang="ko">
<head>
<!-- 자동 생성 — 손으로 고치지 마세요.
     정본: alpha-canvas-proto / prototypes/SP6/2026-08-18-onboarding-to-new-page/flow.html
     갱신: node scripts/publish-onboarding-flow.mjs -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>온보딩 → 스킨 온보딩 (R9 그대로 실행)</title>
<link rel="stylesheet" href="../kit-sds/tokens.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* ⚠ 이 파일은 「전달 구간」만 만든다.
     ① 기본 정보 입력 카드 = 운영 pages/onboarding 재현(AS-IS)
     ② 스킨 온보딩        = round-9/v01-gate.html 을 iframe 으로 **그대로** 실행(무수정)
     R9 파일은 읽기만 한다. 색·간격·타이포는 SDS 토큰만 사용(R-001/R-002). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sds-font-family-base);
    color: var(--sds-text-primary);
    background: var(--sds-bg-secondary);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ── ① 기본 정보 입력 (운영 온보딩 재현) ───────────────────────── */
  #s1 { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: var(--sds-spacing-48) var(--sds-spacing-20) var(--sds-spacing-64); }

  .rail { display: flex; align-items: center; gap: 0; margin-bottom: var(--sds-spacing-32); }
  .rail__dot {
    width: 32px; height: 32px; border-radius: var(--sds-radius-full);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--sds-font-size-sm); font-weight: var(--sds-font-weight-bold);
    background: var(--sds-bg-tertiary); color: var(--sds-text-tertiary);
  }
  .rail__dot.on { background: var(--sds-bg-inverse-primary); color: var(--sds-text-inverse-primary); }
  .rail__line { width: 64px; height: 2px; background: var(--sds-bg-tertiary); }
  .rail__line.on { background: var(--sds-bg-inverse-primary); }

  .card {
    width: 100%; max-width: 500px; background: var(--sds-bg-primary);
    border-radius: var(--sds-radius-2xl); padding: var(--sds-spacing-40);
    box-shadow: var(--sds-shadow-subtle);
  }
  .card__h { font-size: var(--sds-font-size-xl); font-weight: var(--sds-font-weight-bold); }
  .card__s { margin-top: var(--sds-spacing-6); font-size: var(--sds-font-size-sm); color: var(--sds-text-tertiary); }

  .f { margin-top: var(--sds-spacing-20); }
  .f__l { display: block; font-size: var(--sds-font-size-sm); font-weight: var(--sds-font-weight-medium); margin-bottom: var(--sds-spacing-6); }
  .f__l i { color: var(--sds-text-danger); font-style: normal; margin-left: var(--sds-spacing-2); }
  .f__i {
    width: 100%; height: 44px; padding: 0 var(--sds-spacing-12);
    border: 1px solid var(--sds-border-default); border-radius: var(--sds-radius-md);
    font-family: inherit; font-size: var(--sds-font-size-md); color: var(--sds-text-primary);
    background: var(--sds-bg-primary);
  }
  .f__i:focus { outline: none; border-color: var(--sds-border-strong); }

  .agree { display: flex; align-items: center; gap: var(--sds-spacing-8); margin-top: var(--sds-spacing-24); font-size: var(--sds-font-size-sm); }
  .agree input { width: 18px; height: 18px; accent-color: var(--sds-bg-inverse-primary); margin: 0; }
  .agree a { color: var(--sds-text-primary); text-decoration: underline; }

  .act { display: flex; justify-content: flex-end; margin-top: var(--sds-spacing-32); }
  .btn {
    height: 44px; padding: 0 var(--sds-spacing-24); border: 0; border-radius: var(--sds-radius-md);
    background: var(--sds-bg-inverse-primary); color: var(--sds-text-inverse-primary);
    font-family: inherit; font-size: var(--sds-font-size-md); font-weight: var(--sds-font-weight-bold);
    cursor: pointer;
  }

  /* 주석 — 시안이 아니라 이 전달 구간에 대한 설명이다(카드 밖, 낮은 대비) */
  .note {
    width: 100%; max-width: 500px; margin-top: var(--sds-spacing-24);
    border: 1px dashed var(--sds-border-default); border-radius: var(--sds-radius-lg);
    padding: var(--sds-spacing-16) var(--sds-spacing-20);
    font-size: var(--sds-font-size-xs); color: var(--sds-text-tertiary); line-height: 1.6;
  }
  .note b { color: var(--sds-text-secondary); font-weight: var(--sds-font-weight-semibold); }
  .note ul { margin: var(--sds-spacing-8) 0 0 var(--sds-spacing-16); }

  /* ── ② 스킨 온보딩 = R9 그대로 ─────────────────────────────────── */
  #s2 { position: fixed; inset: 0; background: var(--sds-bg-primary); }
  #gate { width: 100%; height: 100%; border: 0; display: block; }

  /* 데모 이동용 — 설계 요소가 아니다 */
  .demo {
    position: fixed; left: var(--sds-spacing-16); bottom: var(--sds-spacing-16); z-index: 999999;
    height: 32px; padding: 0 var(--sds-spacing-12); border: 1px solid var(--sds-border-default);
    border-radius: var(--sds-radius-full); background: var(--sds-bg-primary);
    font-family: inherit; font-size: var(--sds-font-size-2xs); color: var(--sds-text-tertiary);
    cursor: pointer; box-shadow: var(--sds-shadow-subtle);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ① 기본 정보 입력 — 운영 화면 재현 -->
<section id="s1">
  <div class="rail">
    <span class="rail__dot on">1</span>
    <span class="rail__line"></span>
    <span class="rail__dot">2</span>
  </div>

  <div class="card">
    <div class="card__h">기본 정보 입력</div>
    <div class="card__s">서비스 이용을 위해 담당자 정보를 입력해주세요.</div>

    <div class="f">
      <label class="f__l" for="fShop">쇼핑몰명</label>
      <input class="f__i" id="fShop" value="[리뷰-현희] 현희몰" />
    </div>
    <div class="f">
      <label class="f__l" for="fName">담당자명 <i>*</i></label>
      <input class="f__i" id="fName" value="박현희" />
    </div>
    <div class="f">
      <label class="f__l" for="fTel">담당자 연락처 <i>*</i></label>
      <input class="f__i" id="fTel" value="01085612249" />
    </div>
    <div class="f">
      <label class="f__l" for="fMail">담당자 이메일 <i>*</i></label>
      <input class="f__i" id="fMail" value="hyoniiiwood@gmail.com" />
    </div>

    <label class="agree"><input type="checkbox" checked /><span><a href="#">이용약관</a>에 동의합니다.</span></label>

    <div class="act"><button class="btn" id="next">다음</button></div>
  </div>

  <div class="note">
    <b>이 화면 다음이 ② 스킨 온보딩이다.</b> 「다음」을 누르면 <b>이미 배포된 스킨 온보딩 게이트가 그대로 실행</b>된다(파일 무수정).
    <ul>
      <li>기존 ② <b>「준비 완료」 카드는 없어진다</b> — 정보가 0개인 화면을 게이트가 대신한다. <b>스텝 수는 2개 그대로</b>.</li>
      <li>게이트가 묻는 것: 업종 → 구성(상품 수·컨셉·브랜드색·글꼴) → 위젯. 오른쪽 몰이 즉시 갈린다.</li>
      <li>게이트의 「이 설정으로 시작」 → <b>빌더에 값이 얹힌 상태로 도착</b>(＝에디터).</li>
    </ul>
  </div>
</section>

<!-- ② 스킨 온보딩 = R9 그대로 실행 -->
<section id="s2" hidden><iframe id="gate" title="스킨 온보딩 게이트 (R9 V01)"></iframe></section>

<button class="demo" id="back" hidden>데모 · ① 온보딩으로</button>

<script>
  var GATE_SRC = '../proto-gate/index.html';
  var s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
  var f = document.getElementById('gate'), back = document.getElementById('back');

  document.getElementById('next').addEventListener('click', function () {
    s1.hidden = true; s2.hidden = false; back.hidden = false;
    if (!f.src) f.src = GATE_SRC;          /* 누를 때 붇는다 — 게이트가 코치마크까지 처음부터 돈다 */
  });

  back.addEventListener('click', function () {
    s2.hidden = true; s1.hidden = false; back.hidden = true;
    f.removeAttribute('src');              /* 되돌아오면 게이트를 버린다(다음에 새로 시작) */
  });

  /* 구매 전용 CTA 를 덮는다 — 여기는 **이미 구매한** 유저의 온보딩이라
     「스킨 구매하러 가기」·「7일 무료 체험 신청」이 맥락에 맞지 않는다.
     R9 파일은 고치지 않고 부모에서 가린다. 같은 출처일 때만 되므로 공개 배포(같은 도메인)와
     localhost 에서는 동작하고, file:// 로 직접 열면 막혀 구매 CTA 가 그대로 보인다. */
  f.addEventListener('load', function () {
    try {
      var d = f.contentDocument;
      var st = d.createElement('style');
      st.textContent = '#trialFab,#trialReset{display:none !important}';
      d.head.appendChild(st);
    } catch (e) { /* file:// 로 열면 접근이 막힌다 — 구매 CTA 가 그대로 보인다 */ }
  });
</script>
</body>
</html>
